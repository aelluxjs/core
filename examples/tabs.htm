<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Aellux Adaptive Tabs</title>

  <link href="./style.css" rel="stylesheet" />
  <script src="../dist/aellux.min.js" type="text/javascript"></script>

  <link rel="aellux-ext" href="adaptive" data-ae-load-style data-ae-load-when="[data-ae-adaptive]" />

  <script>
    var start = Date.now();

    $ae.init({ mode: "basic" });

    $ae.ext("preferences"); //CORE
    $ae.ext("state-navigation"); //CORE
    $ae.ext("feedback"); //CORE
    $ae.ext("https://drawercdnurl/");//External

    $ae.on("Legacy", function () {

    });
    $ae.on("Awake", function () {
      var time = Date.now() - start;
      console.log("[Aellux] Awake in " + (time / 1000) + "ms")
    });
    $ae.on("Ready", function () {
      var time = Date.now() - start;
      console.log("[Aellux] Ready in " + (time / 1000) + "ms")
    });
  </script>
</head>

<body>
  <div data-ae-fill-viewport>
    <main data-ae-fill-parent data-ae-adaptive style=" background-color: #F59E0B33;">
      <progress data-ae-adaptive-progress style="margin:auto"></progress>

      <nav data-ae-persist data-ae-tab-group>
        <!-- SUPPORTS ANCHOR DIV AND BUTTON -->
        <button data-ae-tab="home" data-ae-title="# Home">
          <span>#</span>
          <span>Home</span>
        </button>
        <a data-ae-tab="profile" data-ae-tab-title>Perfil</a>
        <div data-ae-tab="settings" data-ae-tab-title>Configurações</div>
      </nav>

      <section id="home">
        <h1>Home</h1>
        <p>Conteúdo da página inicial.</p>
        <div data-ae-preference="color-scheme">
          <div data-ae-label></div> :
          <button data-ae-option="dark">Dark</button>
          <button data-ae-option="light">Light</button>
          <button data-ae-option="auto">auto</button>
        </div>
        <a href="./ajax.htm" data-ae-ajax-href="#content,#content2,title">LINK HREF</a>
        <div id="content">Carregar aqui1</div>
        <div id="content2">Carregar aqui2</div>
      </section>

      <section id="profile">
        <h1>Perfil</h1>
        <p>Conteúdo do perfil.</p>
      </section>

      <section id="settings">
        <h1>Configurações</h1>
        <p>Conteúdo das configurações.</p>
      </section>

    </main>
  </div>

</body>

</html>
