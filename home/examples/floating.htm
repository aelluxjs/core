<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Make it yours — aellux.js</title>
    <script src="../../dist/aellux.min.js"></script>
    <script>
      $ae.ext("preference");
      $ae.ext("anchor", { loadStyle: true });
      $ae.ext("present", { loadStyle: true });
      $ae.ext("input");
      $ae.ext("focus");
      $ae.init({ mode: "basic", useHash: false, syncBootstrapThemeTag: true });
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/home.css">
    <script src="floating.js" defer></script>
  </head>
  <body class="p-3 small min-vh-100" style="--bs-heading-font-family: var(--bs-font-sans-serif);">
    <main aria-labelledby="floating-title">
      <p class="eyebrow text-body-secondary mb-1">YOUR CREATIVE CORNER</p><h1 id="floating-title" class="h4 mb-2">Make it yours.</h1>
      <label class="text-body-secondary small" for="trigger-position">Move the workspace card. Its editor follows.</label>
      <input id="trigger-position" class="form-range mt-1" type="range" min="0" max="180" value="20">
      <div class="position-relative d-flex flex-column align-items-center p-3 border rounded-3 bg-body-tertiary" style="height: 20rem;">
        <div id="floating-trigger" class="card p-3 w-100" style="max-width: 18rem; margin-top: 20px;">
          <div class="d-flex flex-wrap align-items-center gap-3">
            <span class="bg-warning rounded-3 p-3 text-dark fw-bold" aria-hidden="true">N.</span>
            <div class="flex-grow-1 text-break" style="min-width: 0;"><span class="eyebrow text-body-secondary">WORKSPACE</span><h2 class="h6 mb-1">Studio North</h2><p id="workspace-reminder" class="small text-body-secondary mb-0">Make something good today.</p></div>
            <button id="edit-workspace" class="btn btn-sm btn-outline-secondary" type="button" data-ae-point data-ae-present-trigger="toggle" data-ae-present-target="floating-panel">Edit</button>
          </div>
        </div>
        <div class="position-absolute z-1" data-ae-anchor-target="floating-trigger"
          data-ae-anchor="bottom-center:top-center, top-center:bottom-center"
          style="width: min(18rem, calc(100% - 2rem));">
          <aside id="floating-panel" data-ae-present="opacity transform" data-ae-dismiss-on-click="false" aria-labelledby="floating-panel-title" hidden
            style="--ae-from-transform: translateY(.5rem) scale(.96); --ae-pop-transform: translateY(0) scale(1); --ae-dismiss-transform: translateY(-.3rem) scale(.98); --ae-pop-duration: 220ms; --ae-dismiss-duration: 160ms;">
            <div class="card p-3 shadow-sm">
              <div class="d-flex justify-content-between align-items-center mb-2"><h2 id="floating-panel-title" class="h6 mb-0">A home for your ideas.</h2><button type="button" class="btn btn-sm btn-outline-secondary" data-ae-present-trigger="dismiss" aria-label="Close editor">×</button></div>
              <label class="small mb-1" for="workspace-name">Workspace name</label><input id="workspace-name" class="form-control form-control-sm mb-2" value="Studio North" data-ae-focus="next">
              <label class="small mb-1" for="workspace-note">A little reminder</label><input id="workspace-note" class="form-control form-control-sm mb-2" value="Make something good today." data-ae-focus="next">
              <button type="button" class="btn btn-sm btn-warning align-self-start" data-ae-present-trigger="dismiss">Done</button>
            </div>
          </aside>
        </div>
      </div>
      <p class="small text-body-secondary mt-3 mb-0">Try Enter to move between fields and Escape to close. Edits stay in this preview.</p>
    </main>
  </body>
</html>
