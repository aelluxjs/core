<div class="dropdown position-relative">
  <button id="btn-version" class="btn btn-outline-adaptive ps-3 dropdown-toggle rounded-1 border" type="button"
    data-ae-trigger="toggle" data-ae-target="dropdown-version" aria-expanded="false">
    <%= it.version %>
  </button>
  <div class="position-absolute" data-ae-anchor-target="btn-version" data-ae-anchor="bottom-right:top-right">
    <ul id="dropdown-version" data-ae-present="opacity transform" hidden="true"
      class="dropdown-menu dropdown-menu-start rounded-2 overflow-hidden position-relative show"
      style="min-width: unset;transform-origin: 100% 0%;">

      <% for (const entry of it.versions) { %>
        <li>
          <a class="dropdown-item<% if (it.version === entry.name) { %> active<% } %>" data-no-ajax=true
            href="<%= entry.href %>">
            <%= entry.name %>
          </a>
        </li>
        <% } %>

    </ul>
  </div>
</div>
