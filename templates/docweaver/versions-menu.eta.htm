<div class="dropdown">
  <button id="btn-version" class="btn btn-outline-adaptive ps-3 dropdown-toggle rounded-1" type="button"
    data-ae-trigger="toggle" data-ae-target="dropdown-version" aria-expanded="false">
    <%= it.version %>
  </button>
  <ul id="dropdown-version" data-ae-anchor-target="btn-version" data-ae-anchor="bottom-right:top-right"
    data-ae-present="opacity transform" hidden="true"
    class="dropdown-menu dropdown-menu-start rounded-2 overflow-hidden position-absolute show"
    style="min-width: unset;">

    <% for (const entry of it.versions) { %>
      <li>
        <a class="dropdown-item<% if (it.version === entry.name) { %> active<% } %>" data-no-ajax=true
          href="<%= entry.href %>">
          <%= entry.name %>
        </a>
      </li>
      <% } %>

  </ul>
</div>
