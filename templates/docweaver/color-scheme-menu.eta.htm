<div data-ae-preference="color-scheme" class="btn-group border rounded-1 rounded overflow-hidden" style="gap:1px;" role="group" aria-label="Basic example">

  <input type="radio" class="btn-check" name="color-mode-selected" id="radio-color-mode-light"
    autocomplete="off" aria-label="Light Mode">
  <label
    class="btn  btn-outline-adaptive py-1 border-0 d-inline-flex justify-content-center align-items-center"
    for="radio-color-mode-light" data-ae-option="light" onclick aria-label="Light Mode">
    <i class="bi bi-sun"></i>
    <span class="visually-hidden">Light Mode</span>
  </label>

  <input type="radio" class="btn-check" name="color-mode-selected" id="radio-color-mode-dark"
    autocomplete="off" aria-label="Dark Mode">
  <label
    class="btn  btn-outline-adaptive py-1 border-0  d-inline-flex justify-content-center align-items-center"
    for="radio-color-mode-dark" data-ae-option="dark" onclick aria-label="Dark Mode">
    <i class="bi bi-moon-fill"></i>
    <span class="visually-hidden">Dark Mode</span>
  </label>

  <input type="radio" class="btn-check" name="color-mode-selected" id="radio-color-mode-auto"
    autocomplete="off" aria-label="Auto Mode">
  <label
    class="btn  btn-outline-adaptive py-1 border-0 d-inline-flex justify-content-center align-items-center"
    for="radio-color-mode-auto" data-ae-option="auto" onclick aria-label="Auto Mode">
    <i class="bi bi-circle-half"></i>
    <span class="visually-hidden">Auto Mode</span>
  </label>

</div>
