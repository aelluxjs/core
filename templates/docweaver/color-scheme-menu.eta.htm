<div data-ae-preference="color-scheme" class="btn-group border rounded-1 rounded overflow-hidden" role="group"
  aria-label="Basic example" style="--bs-border-radius:--bs-border-radius-sm;gap:1px;">

  <input type="radio" class="btn-check" name="color-mode-selected" id="radio-color-mode-light" autocomplete="off"
    aria-label="Light Mode">
  <label class="btn  btn-outline-adaptive py-1 border-0 d-inline-flex justify-content-center align-items-center"
    for="radio-color-mode-light" data-ae-option="light" onclick aria-label="Light Mode">
    <svg class="svg-icon" aria-hidden="true" focusable="false"><use href="#bi-sun"></use></svg>
    <span class="visually-hidden">Light Mode</span>
  </label>

  <input type="radio" class="btn-check" name="color-mode-selected" id="radio-color-mode-dark" autocomplete="off"
    aria-label="Dark Mode">
  <label class="btn  btn-outline-adaptive py-1 border-0  d-inline-flex justify-content-center align-items-center"
    for="radio-color-mode-dark" data-ae-option="dark" onclick aria-label="Dark Mode">
    <svg class="svg-icon" aria-hidden="true" focusable="false"><use href="#bi-moon-fill"></use></svg>
    <span class="visually-hidden">Dark Mode</span>
  </label>

  <input type="radio" class="btn-check" name="color-mode-selected" id="radio-color-mode-auto" autocomplete="off"
    aria-label="Auto Mode">
  <label class="btn  btn-outline-adaptive py-1 border-0 d-inline-flex justify-content-center align-items-center"
    for="radio-color-mode-auto" data-ae-option="auto" onclick aria-label="Auto Mode">
    <svg class="svg-icon" aria-hidden="true" focusable="false"><use href="#bi-circle-half"></use></svg>
    <span class="visually-hidden">Auto Mode</span>
  </label>

</div>
