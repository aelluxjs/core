<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><script src="../../dist/aellux.js"></script></head>
<body>
  <input id="first" data-ae-focus="next">
  <input id="second" data-ae-focus="next" enterkeyhint="done">
  <button id="disabled-next" disabled>Unavailable</button>
  <input id="hidden-next" hidden>
  <input id="third" data-ae-focus="next">
  <button id="last">Last control</button>
  <div id="editable" data-ae-focus="next" contenteditable="true"><span>Editable text</span></div>
  <button id="after-editable">After editable</button>
  <script>
    aelluxJs.ext("state-navigation");
    aelluxJs.ext("focus");
    aelluxJs.init({ useHash: false });
    window.fixtureReady = Promise.all([aelluxJs.wait("state-navigation"), aelluxJs.wait("focus")]);
  </script>
</body>
</html>
