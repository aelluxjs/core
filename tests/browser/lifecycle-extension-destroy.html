<!DOCTYPE html>
<html lang="pt-BR" data-test-status="pending">
<head>
  <meta charset="UTF-8">
  <title>aellux.js validation: isolated Extension destruction</title>
  <script src="./harness.js"></script>
  <script src="../../dist/aellux.js"></script>
  <script>
    var lifecycleCounts = { mount: 0, unmount: 0, destroy: 0 };

    $ae.ext("lifecycle-extension-probe");
    $ae.extAttach("lifecycle-extension-probe", {
      init: function () {
        $ae.mountManager.add("lifecycle-extension-probe", "[data-lifecycle-extension]",
          function () { lifecycleCounts.mount++; },
          function () { lifecycleCounts.unmount++; }
        );
      },
      destroy: function () {
        lifecycleCounts.destroy++;
        $ae.mountManager.remove("lifecycle-extension-probe");
      }
    });

    AelluxJsValidation.run(async function (assert) {
      assert(lifecycleCounts.mount === 1, "Extension target was not mounted");

      await $ae.destroyExtensions("lifecycle-extension-probe");

      assert(lifecycleCounts.unmount === 1, "Extension elements were not unmounted before destroy");
      assert(lifecycleCounts.destroy === 1, "Extension destroy did not run exactly once");
      assert(typeof AelluxJs.ext.lifecycleExtensionProbe === "undefined", "Destroyed Extension API remains public");
      assert(!("lifecycleExtensionProbe" in AelluxJs.registry.ext), "Destroyed Extension remains registered");
      assert(!("lifecycleExtensionProbe" in AelluxJs.registry.extMounters), "Destroyed Extension mounter remains indexed");

      await $ae.destroyExtensions("lifecycle-extension-probe");
      assert(lifecycleCounts.destroy === 1, "Repeated destruction called destroy again");
    });

    $ae.init({ mode: "basic" });
  </script>
</head>
<body>
  <main data-lifecycle-extension>
    <h1>Isolated Extension destruction</h1>
  </main>
  <pre id="validation-result">PENDING</pre>
</body>
</html>
