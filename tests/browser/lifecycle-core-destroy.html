<!DOCTYPE html>
<html lang="pt-BR" data-test-status="pending">
<head>
  <meta charset="UTF-8">
  <title>aellux.js validation: global Core destruction</title>
  <script src="./harness.js"></script>
  <script src="../../dist/aellux.js"></script>
  <script>
    var destroyedExtensions = [];

    function registerProbe(label) {
      $ae.ext(label);
      $ae.extRegister(label, {
        init: function () {},
        destroy: function () { destroyedExtensions.push(label); }
      });
    }

    registerProbe("lifecycle-core-first");
    registerProbe("lifecycle-core-second");

    AelluxJsValidation.run(async function (assert) {
      var queuedTaskRan = false;
      var queuedTask = AelluxJs.waitLayout.update(function () { queuedTaskRan = true; });

      await $ae.destroy();
      await queuedTask;

      assert(queuedTaskRan === false, "Pending layout work ran after global destroy");
      assert(destroyedExtensions.length === 2, "Global destroy did not destroy every Extension");
      assert(typeof AelluxJs.ext.lifecycleCoreFirst === "undefined", "First Extension API remains public");
      assert(typeof AelluxJs.ext.lifecycleCoreSecond === "undefined", "Second Extension API remains public");
      assert(Object.keys(AelluxJs.extRegistry).length === 0, "Extension registry was not cleared");
    });

    $ae.init({ mode: "basic" });
  </script>
</head>
<body>
  <h1>Global Core destruction</h1>
  <pre id="validation-result">PENDING</pre>
</body>
</html>
