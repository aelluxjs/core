<!DOCTYPE html>
<html lang="pt-BR" data-test-status="pending">
<head>
  <meta charset="UTF-8">
  <title>aellux.js validation: eager extension</title>
  <script src="./harness.js"></script>
  <script src="../../dist/aellux.js"></script>
  <script>
    AelluxJsValidation.run(function (assert) {
      assert(AelluxJs.feedback, "Eager extension API is unavailable");
      assert(AelluxJs.feedback.initialized === true, "Eager extension was not initialized during start");
      assert(AelluxJs.extRegistry.feedback.state === "register", "Eager extension was not registered");
    });
    $ae.ext("feedback");
    $ae.init({ mode: "basic" });
  </script>
</head>
<body>
  <h1>Eager extension</h1>
  <pre id="validation-result">PENDING</pre>
</body>
</html>
