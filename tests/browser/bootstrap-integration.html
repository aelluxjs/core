<!DOCTYPE html>
<html lang="pt-BR" data-test-status="pending">
<head>
  <meta charset="UTF-8">
  <title>aellux.js validation: Bootstrap integration</title>
  <link id="bootstrap-css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="./harness.js"></script>
  <script src="../../dist/aellux.js"></script>
  <link rel="aelluxjs-ext" href="adaptive" data-ae-load-when="[data-ae-adaptive]">
  <script>
    AelluxJsValidation.run(function (assert) {
      var target = document.getElementById("bootstrap-card");
      var button = document.getElementById("bootstrap-button");
      var bootstrapStyle = document.getElementById("bootstrap-css");
      assert(bootstrapStyle.sheet, "Bootstrap stylesheet did not load");
      assert(AelluxJs.adaptive, "Adaptive extension was not initialized with Bootstrap present");
      assert(target.classList.contains("ae--mounted"), "Bootstrap component was not mounted");
      assert(target.classList.contains("card"), "aellux.js removed a Bootstrap class");
      assert(button.classList.contains("btn-primary"), "aellux.js changed a Bootstrap utility class");
    });
    $ae.init({ mode: "basic" });
  </script>
</head>
<body class="container py-4">
  <main id="bootstrap-card" class="card shadow-sm" data-ae-adaptive>
    <div class="card-body">
      <h1 class="card-title">Bootstrap integration</h1>
      <button id="bootstrap-button" class="btn btn-primary" type="button">Bootstrap button</button>
    </div>
  </main>
  <pre id="validation-result" class="mt-3">PENDING</pre>
</body>
</html>
