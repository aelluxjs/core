<!DOCTYPE html>
<html lang="pt-BR" data-test-status="pending">
<head>
  <meta charset="UTF-8">
  <title>aellux.js validation: extension with CSS</title>
  <script src="./harness.js"></script>
  <script src="../../dist/aellux.js"></script>
  <script>
    AelluxJsValidation.run(function (assert) {
      var style = document.querySelector("link[data-ae-ext-style='preference']");
      var target = document.getElementById("styled-target");
      assert(style, "Associated extension stylesheet was not appended");
      assert(/extension-style\.css(?:$|[?#])/.test(style.href), "Unexpected extension stylesheet URL");
      assert(target.classList.contains("ae--mounted"), "Extension mounted state was not completed");
    });
    $ae.ext("preference", { loadStyle: "./extension-style.css" });
    $ae.init({ mode: "basic" });
  </script>
</head>
<body>
  <main id="styled-target" data-ae-preference="color-scheme">
    <h1>Extension with CSS</h1>
  </main>
  <pre id="validation-result">PENDING</pre>
</body>
</html>
