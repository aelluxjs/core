<!DOCTYPE html>
<html lang="pt-BR" data-test-status="pending">
<head>
  <meta charset="UTF-8">
  <title>aellux.js validation: HTML and Web Platform</title>
  <script src="./harness.js"></script>
  <script src="../../dist/aellux.js"></script>
  <link rel="aelluxjs-ext" href="preference" data-ae-load-when="[data-ae-preference]">
  <script>
    AelluxJsValidation.run(function (assert) {
      var target = document.getElementById("preference-target");
      assert(AelluxJs.ext.preference, "Preference extension was not initialized");
      assert(target.classList.contains("ae--mounted"), "Web Platform element was not mounted");
      assert(!document.querySelector("[class*='bootstrap']"), "Scenario must not depend on a visual framework");
    });
    $ae.init({ mode: "basic" });
  </script>
</head>
<body>
  <main id="preference-target" data-ae-preference="color-scheme" data-ae-wait-mounted>
    <h1>HTML and Web Platform</h1>
    <p>Native HTML enhanced by an aellux.js Extension.</p>
  </main>
  <pre id="validation-result">PENDING</pre>
</body>
</html>
